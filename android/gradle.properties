# IMPORTANTE: nesta maquina o build so funciona pelo script ..\build_apk.ps1.
# Sockets AF_UNIX nao funcionam dentro de %TEMP% (nem em AppData\Local): o bind
# passa, o connect falha com "Invalid argument". O Gradle usa Selector/Pipe, que
# no Windows saem por AF_UNIX no %TEMP%, e o build morre com
# "java.io.IOException: Unable to establish loopback connection".
# O script redireciona TEMP/TMP para C:\Temp\coleta-build antes de compilar
# (nao adianta por -Djdk.net.unixdomain.tmpdir aqui: o Gradle remove os -D do
# org.gradle.jvmargs na linha de comando do daemon).
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
android.useAndroidX=true
